{% extends "base.html" %}

{% block title %}Reset Password - DCA Bot SaaS{% endblock %}

{% block content %}
<div class="container container-small" style="margin-top: 4rem;">
    <div class="card">
        <h1 style="text-align: center; margin-bottom: 0.5rem;">Reset Your Password</h1>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem;">
            Enter your new password below.
        </p>

        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter new password"
                       required autofocus>
                <small style="color: var(--text-secondary); display: block; margin-top: 0.25rem;">
                    Must be at least 8 characters with uppercase, lowercase, number, and special character
                </small>
            </div>

            <div class="form-group">
                <label for="password_confirm">Confirm New Password</label>
                <input type="password" id="password_confirm" name="password_confirm"
                       placeholder="Confirm new password"
                       required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Reset Password
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="{{ url_for('login') }}" style="color: var(--accent);">
                ← Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
