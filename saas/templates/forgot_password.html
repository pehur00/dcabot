{% extends "base.html" %}

{% block title %}Forgot Password - DCA Bot SaaS{% endblock %}

{% block content %}
<div class="container container-small" style="margin-top: 4rem;">
    <div class="card">
        <h1 style="text-align: center; margin-bottom: 0.5rem;">Forgot Password?</h1>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem;">
            Enter your email address and we'll send you a link to reset your password.
        </p>

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="your.email@example.com"
                       required autofocus>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Send Reset Link
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="{{ url_for('login') }}" style="color: var(--accent);">
                ← Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
