# Render.com Blueprint - SaaS Platform Only
# Branch: feature/saas-transformation
# Main branch (standalone bot) is deployed separately (not via Blueprint)

services:
  # Web Service (Flask dashboard)
  - type: web
    name: dcabot-saas-web
    env: python
    region: frankfurt
    plan: starter  # $7/month
    branch: feature/saas-transformation
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt -r requirements-saas.txt
      python saas/migrate.py
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT saas.app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false  # Set in Render dashboard
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: false

  # Cron Job (executes all active Martingale bots every 5 minutes) - FREE!
  - type: cron
    name: dcabot-saas-scheduler
    env: python
    region: frankfurt
    schedule: "*/5 * * * *"  # Every 5 minutes
    branch: feature/saas-transformation
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt -r requirements-saas.txt
    startCommand: python saas/execute_all_bots.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false

  # Cron Job (executes all active AI bots every 5 minutes) - FREE!
  - type: cron
    name: dcabot-ai-executor
    env: python
    region: frankfurt
    schedule: "*/5 * * * *"  # Every 5 minutes
    branch: feature/saas-transformation
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt -r requirements-saas.txt
    startCommand: python saas/execute_ai_bots.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false

  # Cron Job (weekly backtests for front page performance display) - FREE!
  - type: cron
    name: dcabot-weekly-backtests
    env: python
    region: frankfurt
    schedule: "0 2 * * 0"  # Every Sunday at 2 AM UTC
    branch: feature/saas-transformation
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt -r requirements-saas.txt
    startCommand: python saas/run_weekly_backtests.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      # API_KEY and API_SECRET are optional when using Binance (source='binance')
      # CCXT fetches public market data without authentication
      # Only needed if using Phemex as data source

  # Cron Job (daily OpenRouter model sync) - FREE!
  - type: cron
    name: dcabot-openrouter-sync
    env: python
    region: frankfurt
    schedule: "0 3 * * *"  # Every day at 3 AM UTC
    branch: feature/saas-transformation
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt -r requirements-saas.txt
    startCommand: python saas/sync_openrouter_models.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false

# ============================================================================
# DEPLOYMENT INFO
# ============================================================================
# Cost: $7/month (1 web service, 4 cron jobs are free)
# Region: Frankfurt (EU)
# URL: https://dcabot-saas-web.onrender.com
#
# Services:
# - dcabot-saas-web: Flask dashboard ($7/month starter plan)
# - dcabot-saas-scheduler: Executes all active Martingale bots every 5 minutes (FREE)
# - dcabot-ai-executor: Executes all active AI bots every 5 minutes (FREE)
# - dcabot-weekly-backtests: Runs weekly backtests every Sunday 2 AM UTC (FREE)
# - dcabot-openrouter-sync: Syncs OpenRouter models daily at 3 AM UTC (FREE)
#
# Database: Digital Ocean PostgreSQL (diptrader)
# - Must allow Render IPs: 3.75.158.163, 3.125.183.140, 35.157.117.28,
#   74.220.51.0/24, 74.220.59.0/24
#
# Required env vars (set in Render dashboard):
# - DATABASE_URL: postgresql://diptrader:PASSWORD@host:25060/diptrader?sslmode=require
# - ENCRYPTION_KEY: Generate with Fernet.generate_key()
# - SECRET_KEY: Auto-generated by Render
#
# TO UPGRADE TO BACKGROUND WORKERS (when >10 bots each):
# - Change "type: cron" to "type: worker" in dcabot-saas-scheduler
# - Change "type: cron" to "type: worker" in dcabot-ai-executor
# - Change "schedule" to "plan: starter" for both
# - Cost increases to $21/month ($7 web + $7 worker + $7 worker)
# ============================================================================

version: "1"
